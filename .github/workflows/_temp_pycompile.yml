name: Temporary Python syntax validation
on:
  push:
    branches:
      - feature/post-loss-guards-readonly
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bot source
        run: python -m py_compile mr_bot_v4.py
